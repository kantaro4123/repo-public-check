name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python:
          - "3.10"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install package
        run: python -m pip install .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test installed command
        run: |
          repo-public-check --version
          repo-public-check . --json > report.json
          python -c 'import json; data=json.load(open("report.json")); assert data["ready"] is True'
