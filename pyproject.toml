[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-public-check"
version = "0.1.0"
description = "Check whether a private Git repository is ready to be made public."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "kantaro4123"}]
keywords = ["git", "github", "security", "cli", "open-source"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
repo-public-check = "repo_public_check.cli:main"

[project.urls]
Repository = "https://github.com/kantaro4123/repo-public-check"
Issues = "https://github.com/kantaro4123/repo-public-check/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
